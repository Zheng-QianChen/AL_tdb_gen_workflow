<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL process controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css//all.min.css"> -->
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    </head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-atom me-2"></i>AL 循环控制面板
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="fas fa-home me-1"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="data_preparation.html">
                            <i class="fas fa-database me-1"></i> 数据准备及模型设置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="visualization.html">
                            <i class="fas fa-chart-line me-1"></i> 可视化及ML模型分析
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="model_analysis.html">
                            <i class="fas fa-microscope me-1"></i> tdb模型分析及输出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="text-center mb-5">
            <h1 class="display-4">AL 循环控制面板</h1>
            <p class="lead">自动化材料发现与机器学习工作流</p>
        </div>

        <!-- 功能选项卡片 - 移至系统状态上方 -->
        <div class="row mb-5">
            <div class="col-md-4 mb-4">
                <a href="data_preparation.html" class="text-decoration-none">
                    <div class="card card-option text-center p-4">
                        <i class="fas fa-database text-primary"></i>
                        <h4>数据准备及模型设置</h4>
                        <p class="text-muted">配置输入数据、模型参数和训练设置</p>
                    </div>
                </a>
            </div>
            <div class="col-md-4 mb-4">
                <a href="visualization.html" class="text-decoration-none">
                    <div class="card card-option text-center p-4">
                        <i class="fas fa-chart-line text-success"></i>
                        <h4>可视化及ML模型分析</h4>
                        <p class="text-muted">查看训练过程、结果和ML模型的可视化</p>
                    </div>
                </a>
            </div>
            <div class="col-md-4 mb-4">
                <a href="model_analysis.html" class="text-decoration-none">
                    <div class="card card-option text-center p-4">
                        <i class="fas fa-microscope text-info"></i>
                        <h4>tdb模型分析及输出</h4>
                        <p class="text-muted">根据结果分析简化tdb亚点阵模型<br>并输出单相的tdb格式文件</p>
                    </div>
                </a>
            </div>
        </div>

    <!-- 系统状态 - 移至选项卡下方，并增加高度 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card system-status-card" style="min-height: 160px;">
                <div class="card-body">
                    <h5 class="card-title mb-4">系统状态</h5>
                    <div class="row">
                        <!-- 当前探索的相 -->
                        <div class="col-md-3 d-flex flex-column justify-content-center">
                            <div class="small text-muted">当前探索的相</div>
                            <div id="phase-name" class="fs-5">
                                <span class="loading-spinner"></span>加载中...
                            </div>
                        </div>
                        
                        <!-- 当前迭代 -->
                        <div class="col-md-3 d-flex flex-column justify-content-center">
                            <div class="small text-muted">当前迭代</div>
                            <div id="current-iteration" class="fs-5">
                                <span class="loading-spinner"></span>加载中...
                            </div>
                        </div>
                        
                        <!-- 当前操作 -->
                        <div class="col-md-3 d-flex flex-column justify-content-center">
                            <div class="small text-muted">当前操作</div>
                            <div class="fs-5">
                                <span id="current-operation-number">
                                    <span class="loading-spinner"></span>加载中...
                                </span>
                                <span id="current-operation-text" class="operation-status operation-unknown">未知</span>
                            </div>
                        </div>
                        
                        <!-- 学习模型 -->
                        <div class="col-md-3 d-flex flex-column justify-content-center">
                            <div class="small text-muted">学习模型</div>
                            <div id="ml-model" class="fs-5">
                                <span class="loading-spinner"></span>加载中...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <!-- 控制台部分 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-terminal me-2"></i>控制台</h5>
            </div>
            <div class="card-body">
                <div id="status">连接中…</div>
                <div id="log" class="console-output"></div>
                <div class="controls">
                    <button onclick="doStart()" id="btnStart">
                        <i class="fas fa-play"></i> 开始
                    </button>
                    <button onclick="togglePause()" id="btnPause" disabled>
                        <i class="fas fa-pause"></i> 暂停 / 继续
                    </button>
                    <button onclick="doStop()" id="btnStop" disabled>
                        <i class="fas fa-stop"></i> 停止
                    </button>
                    <button onclick="fetchSystemStatus()" id="btnRefresh" style="background-color: #0d6efd; color: white;">
                        <i class="fas fa-sync"></i> 刷新
                    </button>
                    <button onclick="reloadInputJson()" id="btnReloadInput">
                        <i class="fas fa-file-import"></i> 重新载入input.json
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/index.js"></script>
</body>
</html>
